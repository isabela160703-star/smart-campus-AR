# Redirección de HTTP a HTTPS: si el navegador entra por el puerto 8080
# en texto plano, se le reenvía automáticamente a HTTPS (8443).
server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # El service worker y el manifest deben servirse frescos y con MIME correcto
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Recursos con hash: cacheables a largo plazo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La CA local se ofrece para descarga (instalar en el celular)
    location = /rootCA.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=rootCA.crt";
        try_files $uri =404;
    }

    # Fallback SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
